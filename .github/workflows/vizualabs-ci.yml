name: Vizualabs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  quality:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          VITE_CAL_LINK: ${{ vars.VITE_CAL_LINK }}

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          VITE_CAL_LINK: ${{ vars.VITE_CAL_LINK }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: [quality, e2e]
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_CAL_LINK: ${{ vars.VITE_CAL_LINK }}

      - name: Prepare FTP remote directory
        id: ftp
        env:
          HOSTINGER_FTP_REMOTE_DIR: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
        run: |
          # Strip accidental whitespace/newlines from pasted secrets.
          dir="$(printf '%s' "${HOSTINGER_FTP_REMOTE_DIR:-/public_html/}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$dir" ]; then
            dir="/public_html/"
          fi
          dir="${dir%/}/"
          echo "Using normalized FTP server-dir"
          printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/client/
          # REQUIRED for addon domains — set GitHub secret HOSTINGER_FTP_REMOTE_DIR
          # to the vizualabs.com web root, e.g. /domains/vizualabs.com/public_html/
          # Trailing slash optional; normalized in the step above.
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false

      - name: Verify live site
        run: |
          for path in / /sitemap.xml /robots.txt; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://vizualabs.com${path}")
            echo "${path} → HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Deploy path may be wrong. Set HOSTINGER_FTP_REMOTE_DIR to vizualabs.com public_html in GitHub Secrets."
              exit 1
            fi
          done
