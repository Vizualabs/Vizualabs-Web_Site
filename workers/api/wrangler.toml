name = "vizualabs-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# Free Workers subdomain: https://vizualabs-api.<account>.workers.dev
# Optional custom domain later: api.vizualabs.com (Cloudflare DNS + Workers Routes)

[vars]
# Non-secret defaults (override in dashboard if needed)
LEAD_NOTIFICATION_EMAIL = "info@vizualabs.com"
RESEND_FROM_EMAIL = "Vizualabs <onboarding@resend.dev>"
# Comma-separated origins allowed to call this API
ALLOWED_ORIGINS = "https://vizualabs.com,https://www.vizualabs.com,http://localhost:3000"

# Secrets (set via CLI — never commit):
#   bunx wrangler secret put RESEND_API_KEY
# Optional later:
#   bunx wrangler secret put GEMINI_API_KEY
